<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments - City Hospital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <h2>City Hospital</h2>
      <p>Your Health Dashboard</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="patient-dashboard.html#patientProfileSection">My Profile</a>
        <a href="booking.html">Book Appointment</a>
        <a href="patient-appointments.html">My Appointments</a>
        <button class="logoutBtn">Logout</button>
      </nav>
    </aside>
    <main class="dashboard-main">
      <section>
        <div class="patient-dashboard-header">
          <div>
            <h2 id="patientWelcome">My Appointments</h2>
            <p class="section-subtitle">Real-time status tracking, consultation timeline, and digital medical reports</p>
          </div>
          <div class="live-tracker-status-badge">
            <span class="pulse-live-dot"></span>
            <span class="live-tracker-text">Live Status Tracking</span>
            <button type="button" id="patientManualRefreshBtn" class="refresh-pill-btn" title="Refresh Live Status">🔄 Refresh</button>
          </div>
        </div>
        <div id="patientLiveToast" class="doctor-toast" hidden></div>
        <div id="patientAppointmentsList"></div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
